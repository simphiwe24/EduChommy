<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="profile-wrapper">
      <section class="profile-card">
        <h1 class="welcome-msg">Welcome back!</h1>
        <div class="user-info">
          <img src="img/frame-3.svg" alt="User avatar" class="user-avatar" />
          <p class="user-name">Thando Molui</p>
        </div>

        <img src="img/video.png" alt="video visual" class="profile-illustration" />

        <div class="progress-box">
          <h2>Learning Progress</h2>
          <div class="progress-items">
            <div class="progress-item">
              <img src="img/frame-4.svg" alt="lessons icon" />
              <p>Lessons</p>
              <strong>12/20</strong>
            </div>
            <div class="progress-item">
              <img src="img/frame.svg" alt="quizzes icon" />
              <p>Quizzes</p>
              <strong>8/15</strong>
            </div>
          </div>
        </div>

        <div class="settings-box">
          <div class="setting">
            <img src="img/frame-5.svg" alt="settings" />
            <span>Settings</span>
          </div>
          <div class="setting">
            <img src="img/frame-2.svg" alt="notifications" />
            <span>Notifications</span>
          </div>
          <div class="setting">
            <img src="img/image.svg" alt="help" />
            <span>Help & Support</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
